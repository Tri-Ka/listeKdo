; Réglages relevés sur le phpinfo() de Free (PHP 4.4.3).
register_globals = On
magic_quotes_gpc = On
short_open_tag = On
safe_mode = On
display_errors = On
error_reporting = 2039        ; E_ALL & ~E_NOTICE
allow_url_fopen = On
file_uploads = On
upload_max_filesize = 2M
post_max_size = 2M
memory_limit = 32M
max_execution_time = 30
session.save_path = /tmp/php-sessions
