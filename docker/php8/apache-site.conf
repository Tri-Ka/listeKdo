ServerName listekdo
ServerTokens Prod
ServerSignature Off

# La VM de la Freebox n'a que 512 Mo : peu de processus Apache à la fois.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 12
    MaxConnectionsPerChild 500
</IfModule>

<VirtualHost *:80>
    DocumentRoot /var/www/site
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # Le site garde son adresse /listeKdo/, comme chez Free
    RedirectMatch 302 ^/$ /listeKdo/

    <Directory /var/www/site>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Pas de fichiers cachés (.git, .htaccess…) ni de sauvegardes d'éditeur
    <FilesMatch "^\.|~$|\.(bak|swp|sql)$|^config\.php$">
        Require all denied
    </FilesMatch>
</VirtualHost>
