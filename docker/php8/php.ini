; PHP 8 : pas d'erreurs affichées aux visiteurs (lib/bootstrap.php les affiche en local).
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED
expose_php = Off
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 128M
max_execution_time = 30
date.timezone = Europe/Paris
session.cookie_httponly = 1
; mail() passe par msmtp (configuré par start.sh)
sendmail_path = "/usr/bin/msmtp -t"
