<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Idée cadeau">
    <defs>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffe1ea"/>
            <stop offset=".6" stop-color="#ece6ff"/>
            <stop offset="1" stop-color="#ece6ff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff7d8e"/>
            <stop offset="1" stop-color="#e93d6a"/>
        </linearGradient>
        <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff9aa8"/>
            <stop offset="1" stop-color="#f4577a"/>
        </linearGradient>
        <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd86e"/>
            <stop offset="1" stop-color="#ffaf2e"/>
        </linearGradient>
        <linearGradient id="bow" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe08a"/>
            <stop offset="1" stop-color="#ffb02e"/>
        </linearGradient>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8"/>
        </filter>
    </defs>

    <circle cx="200" cy="160" r="128" fill="url(#halo)"/>

    <!-- Étincelles -->
    <g fill="#b9a6ff">
        <path d="M92 92 q3 13 16 16 q-13 3 -16 16 q-3 -13 -16 -16 q13 -3 16 -16z"/>
        <path d="M318 196 q2 9 11 11 q-9 2 -11 11 q-2 -9 -11 -11 q9 -2 11 -11z"/>
    </g>
    <g fill="#ffc24b">
        <path d="M310 70 q3 12 15 15 q-12 3 -15 15 q-3 -12 -15 -15 q12 -3 15 -15z"/>
        <circle cx="86" cy="200" r="5"/>
    </g>
    <circle cx="342" cy="128" r="4" fill="#ff8fa3"/>
    <circle cx="120" cy="60" r="3.5" fill="#ff8fa3"/>

    <!-- Ombre -->
    <ellipse cx="200" cy="262" rx="86" ry="10" fill="#6b4fd8" opacity=".22" filter="url(#soft)"/>

    <!-- Boîte -->
    <rect x="132" y="150" width="136" height="108" rx="16" fill="url(#box)"/>
    <rect x="132" y="150" width="136" height="14" fill="#c92a57" opacity=".25"/>
    <rect x="144" y="170" width="12" height="74" rx="6" fill="#fff" opacity=".18"/>
    <rect x="188" y="150" width="24" height="108" fill="url(#ribbon)"/>

    <!-- Couvercle -->
    <rect x="120" y="120" width="160" height="40" rx="13" fill="url(#lid)"/>
    <rect x="132" y="128" width="40" height="8" rx="4" fill="#fff" opacity=".35"/>
    <rect x="186" y="120" width="28" height="40" fill="url(#ribbon)"/>
    <rect x="186" y="120" width="28" height="40" fill="#fff" opacity=".12"/>

    <!-- Nœud -->
    <path d="M196 120 C 170 122 140 104 150 84 C 158 68 184 82 196 120 Z" fill="url(#bow)"/>
    <path d="M204 120 C 230 122 260 104 250 84 C 242 68 216 82 204 120 Z" fill="url(#bow)"/>
    <path d="M194 116 C 178 112 162 102 164 92 C 168 84 184 96 194 116 Z" fill="#e8941f" opacity=".45"/>
    <path d="M206 116 C 222 112 238 102 236 92 C 232 84 216 96 206 116 Z" fill="#e8941f" opacity=".45"/>
    <rect x="187" y="108" width="26" height="20" rx="8" fill="#ffc94d"/>
    <rect x="192" y="112" width="9" height="5" rx="2.5" fill="#fff" opacity=".5"/>
</svg>
