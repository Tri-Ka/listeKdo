# Apache de la Freebox : le site (listeKdo/) est servi à la racine, derrière Caddy (Caddyfile).
# Remplace docker/php8/apache-site.conf, prévu pour le dev local en /listeKdo/.
ServerName listekdo
ServerTokens Prod
ServerSignature Off

# La VM n'a que 512 Mo : peu de processus Apache à la fois.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 12
    MaxConnectionsPerChild 500
</IfModule>

<VirtualHost *:80>
    DocumentRoot /var/www/site
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    <Directory /var/www/site>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Pas de fichiers cachés (.git, .htaccess…), de sauvegardes ni de config.php
    <FilesMatch "^\.|~$|\.(bak|swp|sql)$|^config\.php$">
        Require all denied
    </FilesMatch>
</VirtualHost>
